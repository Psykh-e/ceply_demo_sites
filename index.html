<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CEPLY — Digital Archive</title>

  <!-- CEPLYTECH KURUMSAL FONTU: GEIST SANS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-sans/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Core Libraries: GSAP & Lenis -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>

  <style>
    /* ==========================================================================
       01. CORE SYSTEM & VARIABLES
       ========================================================================== */
    :root {
      --bg: #070707;
      --text: #f0f0f0;
      --text-muted: #666666;
      --border: rgba(255, 255, 255, 0.1);
      
      /* Dinamik Accent Rengi (Hover ile değişecek) */
      --accent: #E23D28; 

      /* Ceplytech Kurumsal Tipografi */
      --font-geist-sans: "Geist", "Geist Fallback", sans-serif;
      --font-display: 'Syne', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html { background-color: var(--bg); -webkit-font-smoothing: antialiased; }
    
    body {
      color: var(--text);
      font-family: var(--font-geist-sans);
      overscroll-behavior: none;
      cursor: none; /* Özel Ceply İmleci İçin Gizlendi */
    }

    ::selection { background: var(--text); color: var(--bg); }
    button { background: none; border: none; color: inherit; font: inherit; outline: none; cursor: none; }
    a { text-decoration: none; color: inherit; cursor: none; }

    /* ==========================================================================
       02. TACTILE NOISE OVERLAY
       ========================================================================== */
    .grain {
      position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* ==========================================================================
       03. CEPLYTECH CUSTOM CURSOR (React'ten Çevrildi)
       ========================================================================== */
    .ceply-cursor-dot {
      position: fixed; top: 0; left: 0; 
      width: 6px; height: 6px;
      background: var(--text); 
      border-radius: 50%;
      pointer-events: none; z-index: 10000;
      will-change: transform;
    }

    .ceply-cursor-ring {
      position: fixed; top: 0; left: 0; 
      width: 36px; height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.25); 
      border-radius: 50%;
      pointer-events: none; z-index: 9999;
      will-change: transform;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                  height 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-color 0.3s ease;
    }

    /* Hover Durumu Sınıfı */
    .ceply-cursor-ring.is-hover {
      width: 64px; height: 64px;
      border-color: var(--accent); /* Dinamik olarak projenin rengini alır */
    }

    /* Hover Anlamlı Görsel Çıkarıcısı */
    .hover-reveal-img {
      position: fixed; top: 0; left: 0;
      width: 380px; height: 240px;
      transform: translate(-50%, -50%) scale(0.8);
      pointer-events: none; z-index: 50;
      opacity: 0; visibility: hidden;
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    }
    .hover-reveal-img img {
      width: 100%; height: 100%; object-fit: cover;
      transform: scale(1.2); 
    }

    /* ==========================================================================
       04. HUD (HEADER)
       ========================================================================== */
    header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 2rem 4vw; mix-blend-mode: difference;
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    }
    .logo { font-family: var(--font-geist-sans); font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }

    /* ==========================================================================
       05. THE KINETIC INDEX
       ========================================================================== */
    .index-container {
      padding: 25vh 4vw 15vh 4vw;
      width: 100%; min-height: 100vh;
    }

    .index-header {
      font-size: 12px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 2px;
      margin-bottom: 5vh; display: flex; justify-content: space-between;
      border-bottom: 1px solid var(--border); padding-bottom: 2vh;
    }

    .project-list { list-style: none; display: flex; flex-direction: column; }

    .project-item {
      position: relative; display: flex; align-items: center; justify-content: space-between;
      padding: 4.5vh 0; border-bottom: 1px solid var(--border);
      color: var(--text-muted); transition: color 0.4s ease;
      cursor: none; 
    }

    .project-info-left { display: flex; align-items: baseline; gap: 4vw; }
    
    .project-num {
      font-size: 14px; font-variant-numeric: tabular-nums; font-weight: 500;
      transition: transform 0.4s ease, color 0.4s ease;
    }

    .project-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(3.5rem, 7vw, 9rem);
      line-height: 0.85; text-transform: uppercase; letter-spacing: -0.02em;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s ease;
    }

    .project-category {
      font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 500;
      text-align: right; transition: transform 0.4s ease;
    }

    /* Kinetik Hover Efektleri */
    .project-list:hover .project-item { color: rgba(255,255,255,0.1); } 
    .project-item:hover { color: var(--text); z-index: 2; }
    .project-item:hover .project-title { transform: translateX(2vw); color: var(--text); }
    .project-item:hover .project-num { transform: translateX(-1vw); color: var(--accent); }
    .project-item:hover .project-category { transform: translateX(-1vw); }

    /* ==========================================================================
       06. FULLSCREEN PORTAL
       ========================================================================== */
    .portal {
      position: fixed; inset: 0; z-index: 8000;
      background: var(--bg);
      display: flex; flex-direction: column;
      clip-path: circle(0% at 50% 50%);
      pointer-events: none;
    }

    .portal.active { pointer-events: auto; }

    .portal-controls {
      position: absolute; top: 0; left: 0; width: 100%; height: 64px;
      background: rgba(7, 7, 7, 0.9); backdrop-filter: blur(10px);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 30px; z-index: 8010; 
      border-bottom: 1px solid var(--accent);
      transform: translateY(-100%); transition: transform 0.5s 0.5s ease, border-color 0.4s ease;
    }
    .portal.active .portal-controls { transform: translateY(0); }

    .portal-project-name { font-family: var(--font-display); font-size: 16px; font-weight: 600; text-transform: uppercase; }
    
    .btn-close-portal {
      background: var(--text); color: var(--bg);
      padding: 8px 20px; border-radius: 99px; font-size: 11px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
      transition: transform 0.3s ease;
    }
    .btn-close-portal:hover { transform: scale(1.05); }

    .portal-iframe-wrapper {
      width: 100%; height: 100%;
      padding-top: 64px; 
      background: #ffffff; 
      position: relative;
    }

    .portal-iframe { width: 100%; height: 100%; border: none; opacity: 0; transition: opacity 0.5s; }
    .portal-iframe.loaded { opacity: 1; }

    .portal-loader {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 15px;
      color: var(--bg); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; font-weight: 500;
      transition: opacity 0.5s;
    }
    .portal-loader.hidden { opacity: 0; pointer-events: none; }
    .spinner { 
      width: 40px; height: 40px; border: 2px solid rgba(0,0,0,0.1); 
      border-top-color: var(--accent); border-radius: 50%; 
      animation: spin 1s linear infinite; 
      transition: border-top-color 0.4s ease;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ==========================================================================
       07. RESPONSIVE DESIGN (MOBILE)
       ========================================================================== */
    @media (max-width: 1024px) {
      body { cursor: auto; }
      .ceply-cursor-dot, .ceply-cursor-ring, .hover-reveal-img { display: none !important; }
      
      .index-container { padding: 15vh 4vw; }
      .project-info-left { flex-direction: column; gap: 0; align-items: flex-start; }
      .project-num { margin-bottom: 10px; }
      .project-item { flex-direction: column; align-items: flex-start; gap: 20px; padding: 5vh 0; cursor: auto; }
      .project-category { text-align: left; }
      
      .project-item:hover .project-title { transform: none; }
      .project-item:hover .project-num { transform: none; }
      .project-item:hover .project-category { transform: none; }
      .project-list:hover .project-item { color: var(--text-muted); }
      .project-item:hover { color: var(--text); }
      
      .portal-controls { padding: 0 15px; }
      .btn-close-portal, button, a { cursor: pointer; }
    }
  </style>
</head>
<body>

  <div class="grain"></div>

  <!-- CEPLYTECH CURSOR HTML -->
  <div id="ceplyRing" class="ceply-cursor-ring" aria-hidden="true"></div>
  <div id="ceplyDot" class="ceply-cursor-dot" aria-hidden="true"></div>

  <!-- HOVER IMAGE REVEAL -->
  <div class="hover-reveal-img" id="revealImgContainer">
    <img src="" alt="Project Preview" id="revealImg">
  </div>

  <header>
    <div>Selected Works <br>2026 Archive</div>
    <div class="logo">Ceply.</div>
    <div style="text-align: right;">Digital Exhibition <br>Scroll to Explore</div>
  </header>

  <main id="smooth-wrapper">
    <div class="index-container">
      
      <div class="index-header">
        <span>Project Name</span>
        <span>Discipline</span>
      </div>

      <!-- KİNETİK DİZİN LİSTESİ (JAVASCRIPT İLE OTOMATİK DOLDURULACAK) -->
      <ul class="project-list"></ul>
      
    </div>
  </main>

  <div class="portal" id="portal">
    <div class="portal-controls">
      <div class="portal-project-name" id="portalTitle">Project Name</div>
      <button class="btn-close-portal" id="closePortal">Close Project</button>
    </div>
    <div class="portal-iframe-wrapper">
      <div class="portal-loader" id="portalLoader">
        <div class="spinner"></div>
        <span>Loading Experience...</span>
      </div>
      <iframe class="portal-iframe" id="portalIframe" src=""></iframe>
    </div>
  </div>

  <script>
    // ==========================================================================
    // 00. DYNAMIC PROJECT GENERATION
    // ==========================================================================
    const projectFolders = [
      { id: "cafe1", category: "E-Commerce Flow", img: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=800&q=80" },
      { id: "cafe2", category: "React Application", img: "https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=800&q=80" },
      { id: "cafe3", category: "Spatial Layout", img: "https://images.unsplash.com/photo-1559925393-8be0ec4767c8?auto=format&fit=crop&w=800&q=80" },
      { id: "cafe4", category: "Minimal Interface", img: "https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=800&q=80" },
      { id: "resto1", category: "Fine Dining Concept", img: "https://images.unsplash.com/photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=800&q=80" },
      { id: "resto2", category: "Restaurant Interface", img: "https://images.unsplash.com/photo-1550966871-3ed3cdb5ed0c?auto=format&fit=crop&w=800&q=80" },
      { id: "emlak1", category: "Real Estate System", img: "https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=800&q=80" },
      { id: "emlak2", category: "Property Viewer", img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80" },
      { id: "emlak3", category: "Housing Platform", img: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80" },
      { id: "emlak4", category: "Luxury Estates", img: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80" }
    ];

    // Döngüsel olarak kullanılacak projenin hover renkleri
    const projectColors = [
      "rgb(59, 111, 224)", // Mavi
      "rgb(231, 201, 106)", // Sarı
      "rgb(224, 90, 48)",  // Turuncu
      "rgb(168, 237, 188)" // Yeşil
    ];

    // Rakamları ingilizce kelimelere çevirecek obje sözlük
    const numToWordMap = {
      "1": "One", "2": "Two", "3": "Three", "4": "Four", "5": "Five",
      "6": "Six", "7": "Seven", "8": "Eight", "9": "Nine", "0": "Zero"
    };

    // Klasör ismini (örn: "cafe1") -> Başlığa (örn: "Cafe One") dönüştüren fonksiyon
    function formatProjectTitle(id) {
      const match = id.match(/([a-zA-Z]+)(\d+)/);
      if (match) {
        const text = match[1].charAt(0).toUpperCase() + match[1].slice(1);
        const num = match[2].split('').map(n => numToWordMap[n] || n).join(' ');
        return `${text} ${num}`;
      }
      return id.charAt(0).toUpperCase() + id.slice(1);
    }

    const projectListEl = document.querySelector('.project-list');
    let generatedHTML = '';

    projectFolders.forEach((project, index) => {
      const color = projectColors[index % projectColors.length];
      const title = formatProjectTitle(project.id);
      const numStr = String(index + 1).padStart(2, '0');
      
      generatedHTML += `
        <li class="project-item" data-color="${color}" data-folder-id="${project.id}" data-img="${project.img}">
          <div class="project-info-left">
            <span class="project-num">${numStr}</span>
            <h2 class="project-title">${title}</h2>
          </div>
          <span class="project-category">${project.category}</span>
        </li>
      `;
    });

    projectListEl.innerHTML = generatedHTML;

    // Klasördeki index.html içeriğinde <script type="module"> varlığını kontrol eden dinamik fonksiyon
    async function resolveProjectUrl(folderId) {
      try {
        const response = await fetch(`./${folderId}/index.html`);
        if (!response.ok) return `./${folderId}/index.html`;

        const htmlText = await response.text();
        
        // Klasördeki HTML içinde type="module" var mı?
        const isVite = htmlText.includes('type="module"');

        // Vite ise klasör yolu (./emlak3/), düz HTML ise (./cafe1/index.html)
        return isVite ? `./${folderId}/` : `./${folderId}/index.html`;
      } catch (err) {
        return `./${folderId}/index.html`;
      }
    }

    // ==========================================================================
    // 01. SMOOTH SCROLL (LENIS)
    // ==========================================================================
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      direction: 'vertical',
      smooth: true,
      smoothTouch: false,
    });

    function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
    requestAnimationFrame(raf);

    // ==========================================================================
    // 02. CEPLYTECH CURSOR & IMAGE REVEAL LOGIC
    // ==========================================================================
    const isTouchDevice = (('ontouchstart' in window) || (navigator.maxTouchPoints > 0));
    
    if (!isTouchDevice) {
      const dot = document.getElementById('ceplyDot');
      const ring = document.getElementById('ceplyRing');
      const revealContainer = document.getElementById('revealImgContainer');
      const revealImg = document.getElementById('revealImg');

      let rx = window.innerWidth / 2;
      let ry = window.innerHeight / 2;
      let dx = rx;
      let dy = ry;

      const move = (e) => {
        dx = e.clientX;
        dy = e.clientY;
        if (dot) {
          dot.style.transform = `translate3d(${dx}px, ${dy}px, 0) translate(-50%, -50%)`;
        }
        
        gsap.to(revealContainer, {
          x: dx, y: dy, duration: 0.4, ease: "power3.out"
        });
      };

      let rafId = 0;
      const loop = () => {
        rx += (dx - rx) * 0.18; 
        ry += (dy - ry) * 0.18;
        if (ring) {
          ring.style.transform = `translate3d(${rx}px, ${ry}px, 0) translate(-50%, -50%)`;
        }
        rafId = requestAnimationFrame(loop);
      };

      const hoverable = "a, button, [role='button'], [data-cursor='hover'], .project-item, .btn-close-portal";

      const over = (e) => {
        const t = e.target;
        if (t.closest(hoverable)) {
          ring?.classList.add('is-hover');
        }
      };

      const out = (e) => {
        const t = e.target;
        const hovered = t.closest(hoverable);
        if (!hovered) return;
        const next = e.relatedTarget;
        if (next instanceof Node && hovered.contains(next)) return;
        ring?.classList.remove('is-hover');
      };

      rafId = requestAnimationFrame(loop);
      window.addEventListener('mousemove', move);
      document.addEventListener('mouseover', over);
      document.addEventListener('mouseout', out);

      document.querySelectorAll('.project-item').forEach(item => {
        item.addEventListener('mouseenter', () => {
          const hoverColor = item.getAttribute('data-color');
          if(hoverColor) {
            document.documentElement.style.setProperty('--accent', hoverColor);
          }

          const imgSrc = item.getAttribute('data-img');
          revealImg.src = imgSrc;
          
          gsap.to(revealContainer, {
            opacity: 1, autoAlpha: 1, scale: 1, duration: 0.4, ease: "power3.out"
          });
          gsap.fromTo(revealImg, 
            { scale: 1.2 }, { scale: 1, duration: 0.8, ease: "power3.out" }
          );
        });

        item.addEventListener('mouseleave', () => {
          gsap.to(revealContainer, {
            opacity: 0, autoAlpha: 0, scale: 0.8, duration: 0.4, ease: "power3.out"
          });
        });
      });
    }

    // ==========================================================================
    // 03. INITIAL LOAD ANIMATION
    // ==========================================================================
    window.addEventListener('load', () => {
      gsap.from('.index-header', { opacity: 0, y: 20, duration: 1, delay: 0.2 });
      gsap.from('.project-item', { opacity: 0, y: 50, duration: 1, stagger: 0.1, ease: "power3.out", delay: 0.4 });
    });

    // ==========================================================================
    // 04. PORTAL (IFRAME) LOGIC
    // ==========================================================================
    const portal = document.getElementById('portal');
    const portalIframe = document.getElementById('portalIframe');
    const portalTitle = document.getElementById('portalTitle');
    const portalLoader = document.getElementById('portalLoader');
    const btnClose = document.getElementById('closePortal');
    let clickX = 0, clickY = 0;

    document.querySelectorAll('.project-item').forEach(item => {
      item.addEventListener('click', async (e) => {
        const clickedColor = item.getAttribute('data-color');
        if(clickedColor) {
           document.documentElement.style.setProperty('--accent', clickedColor);
        }

        clickX = e.clientX || window.innerWidth/2; 
        clickY = e.clientY || window.innerHeight/2;
        
        const folderId = item.getAttribute('data-folder-id');
        const title = item.querySelector('.project-title').textContent;

        // Tıklandığı an arka planda hızlıca type="module" kontrolü yapılarak URL çözümlenir
        const targetUrl = await resolveProjectUrl(folderId);

        openPortal(targetUrl, title, clickX, clickY);
      });
    });

    function openPortal(url, title, x, y) {
      portalTitle.textContent = title;
      lenis.stop(); 
      document.body.style.overflow = 'hidden';
      
      portalIframe.classList.remove('loaded');
      portalLoader.classList.remove('hidden');
      portalIframe.src = url;

      portalIframe.onload = () => {
        portalLoader.classList.add('hidden');
        portalIframe.classList.add('loaded');
      };

      portal.classList.add('active');

      gsap.fromTo(portal, 
        { clipPath: `circle(0% at ${x}px ${y}px)` },
        { clipPath: `circle(150% at ${x}px ${y}px)`, duration: 1, ease: "power4.inOut" }
      );
    }

    function closePortalFunc() {
      gsap.to(portal, {
        clipPath: `circle(0% at ${clickX}px ${clickY}px)`, 
        duration: 0.8, 
        ease: "power4.inOut",
        onComplete: () => {
          portal.classList.remove('active');
          portalIframe.src = ''; 
          lenis.start(); 
          document.body.style.overflow = '';
        }
      });
    }

    btnClose.addEventListener('click', closePortalFunc);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && portal.classList.contains('active')) {
        closePortalFunc();
      }
    });

  </script>
</body>
</html>
